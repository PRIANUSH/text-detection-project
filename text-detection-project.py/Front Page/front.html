<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Detection</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Using a simple icon from Font Awesome for the "AI" logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <i class="fas fa-robot logo-icon"></i>
                <h1>AI Text Detection</h1>
            </div>
            <div class="drag-drop-area">
                <p>Drag & Drop or Click(only images/pdf)</p>
            </div>
            <div class="buttons">
                <button class="btn upload">Upload</button>
                <button class="btn extract">Extract</button>
            </div>
            <div class="extracted-text-area">
                <p id="outputText">Extracted text will appear here...</p>
            </div>
            <div class="buttons">
                <button class="btn copy">Copy</button>
            </div>
            <div class="buttons">
                <button class="btn listen"onclick="speakText()">🔊 Listen</button>
            </div>
            <div class="buttons">
                <button class="btn stop" onclick="stopSpeech()">Stop</button>
            </div>
            
        </div>
    </div>
     <script src="front1.js"></script>
</body>
</html>
